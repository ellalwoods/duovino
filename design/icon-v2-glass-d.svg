      <stop offset="1" stop-color="#f6ecd4"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7a6"/>
      <stop offset="1" stop-color="#e2bf5c"/>
