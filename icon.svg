<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a07a"/>
      <stop offset=".55" stop-color="#f8c48d"/>
      <stop offset="1" stop-color="#fde0aa"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe2a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ebb3a2"/><stop offset="1" stop-color="#deaa92"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ae96"/><stop offset="1" stop-color="#c99f80"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7a07e"/><stop offset="1" stop-color="#b48c6a"/></linearGradient>
    <filter id="stain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- the sun, low over the hills, ringed like the mark a glass leaves -->
    <circle cx="256" cy="262" r="190" fill="url(#glow)"/>
    <circle cx="256" cy="262" r="62" fill="#fff0c8"/>
    <g filter="url(#stain)">
      <circle cx="256" cy="262" r="104" fill="none" stroke="#fffaf1" stroke-width="13" opacity=".85"/>
      <circle cx="261" cy="258" r="113" fill="none" stroke="#fffaf1" stroke-width="3" opacity=".9"/>
    </g>
    <!-- rolling vineyard hills -->
    <path d="M0 322 C90 292 170 308 260 288 C350 268 430 294 512 282 V512 H0Z" fill="url(#h1)" opacity=".92"/>
    <path d="M0 372 C140 334 270 362 512 322 V512 H0Z" fill="url(#h2)"/>
    <path d="M0 436 C160 398 330 422 512 384 V512 H0Z" fill="url(#h3)"/>
    <!-- vine rows running to the horizon -->
    <g stroke="#8f6a4a" stroke-linecap="round" fill="none" opacity=".45">
      <path d="M-60 540 Q120 450 236 422" stroke-width="7"/>
      <path d="M70 540 Q170 460 246 420" stroke-width="7"/>
      <path d="M200 540 Q230 470 256 418" stroke-width="7"/>
      <path d="M330 540 Q290 470 266 420" stroke-width="7"/>
      <path d="M460 540 Q350 460 276 422" stroke-width="7"/>
      <path d="M590 540 Q400 450 288 424" stroke-width="7"/>
    </g>
  </g>
</svg>
