<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Duovino">
  <title>Duovino</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shared SVG filters: organic wine-stain edges and paper grain -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="stain" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="1" seed="2" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
      </filter>
      <filter id="mapwobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
      </filter>
      <filter id="paper">
        <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" result="n"/>
        <feColorMatrix in="n" values="0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .25  0 0 0 .07 0"/>
        <feComposite in2="SourceGraphic" operator="in"/>
      </filter>
      <pattern id="dust" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r=".7" fill="#d9d2c4"/><circle cx="4" cy="3.5" r=".5" fill="#cfc6b6"/><circle cx="2.5" cy="5" r=".4" fill="#e6dfd2"/>
      </pattern>
    </defs>
  </svg>
  <main id="app" aria-live="polite"></main>
  <div id="overlay"></div>
  <script src="data.js"></script>
  <script src="syllabus.js"></script>
  <script src="champagne.js"></script>
  <script src="wines.js"></script>
  <script src="grapes.js"></script>
  <script src="grapes-core.js"></script>
  <script src="grapes-med.js"></script>
  <script src="grapes-aromatic.js"></script>
  <script src="grapes-reds.js"></script>
  <script src="grapes-beaten.js"></script>
  <script src="regions-1.js"></script>
  <script src="labels.js"></script>
  <script src="scenes.js"></script>
  <script src="app.js"></script>
</body>
</html>
